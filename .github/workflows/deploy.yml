name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# x70.dev is a single R2 bucket (www-x70-dev) with two custom domains bound to
# it: x70.dev and assets.x70.dev. Everything is published to that one bucket.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — an API token with "Workers R2 Storage: Edit"
#   R2_ACCOUNT_ID         — the Cloudflare account ID
#   R2_BUCKET             — the bucket name
#   CF_ZONE_ID            — the x70.dev zone, for the post-deploy cache purge
#
# The account ID and bucket name are not really secret, and masking them makes
# a failed upload print *** instead of the bucket it tried. Prefer repository
# variables so they show up in the log; fall back to secrets if not set.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
  BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
  CF_ZONE_ID: ${{ vars.CF_ZONE_ID || secrets.CF_ZONE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vet
        run: make check

      - name: Test the JavaScript SHA-256 against a known-good implementation
        run: make test

      # `make dist` runs `make wasm`, which rebuilds main.wasm AND re-copies
      # js/wasm_exec.js out of this toolchain's GOROOT. They are a matched pair.
      - name: Build
        run: make dist

      - name: Check the wasm shim matches the compiling toolchain
        run: |
          diff "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/js/wasm_exec.js \
            || { echo "::error::js/wasm_exec.js does not match $(go env GOVERSION)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # R2 stores the content type per object, so it has to be set on upload —
      # there is no server-side extension sniffing to fall back on. A wrong
      # type here is fatal for two files in particular: main.wasm must be
      # application/wasm for instantiateStreaming, and the ES modules must be
      # text/javascript or the browser refuses to execute them.
      - name: Publish to R2
        run: |
          set -euo pipefail

          # Fail with a clear message rather than letting wrangler try to
          # upload to a bucket called "".
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is not set}"
          : "${CLOUDFLARE_ACCOUNT_ID:?R2_ACCOUNT_ID secret is not set}"
          : "${BUCKET:?R2_BUCKET secret is not set}"

          # Confirm the token, the account ID and the bucket name agree before
          # uploading anything. This isolates a credentials problem from a
          # content problem, and prints the target when the values are
          # variables rather than masked secrets.
          echo "target: account=$CLOUDFLARE_ACCOUNT_ID bucket=$BUCKET"
          npx --yes wrangler@4 r2 bucket info "$BUCKET" \
            || { echo "::error::cannot reach bucket '$BUCKET' in account '$CLOUDFLARE_ACCOUNT_ID' - check CLOUDFLARE_API_TOKEN permissions and that R2_ACCOUNT_ID matches the token's account"; exit 1; }

          content_type() {
            case "$1" in
              *.html)  echo "text/html; charset=utf-8" ;;
              *.css)   echo "text/css; charset=utf-8" ;;
              *.js|*.mjs) echo "text/javascript; charset=utf-8" ;;
              *.wasm)  echo "application/wasm" ;;
              *.woff2) echo "font/woff2" ;;
              *.webp)  echo "image/webp" ;;
              *.svg)   echo "image/svg+xml" ;;
              *.ico)   echo "image/x-icon" ;;
              *.xml)   echo "application/xml" ;;
              *.txt)   echo "text/plain; charset=utf-8" ;;
              *)       echo "application/octet-stream" ;;
            esac
          }

          # Anything the HTML depends on by a stable path must revalidate with
          # it, or the two drift apart: a visitor holding day-old JS alongside
          # fresh HTML runs a combination that was never deployed together.
          # `no-cache` still stores the file, it just checks before reuse, so
          # the usual answer is a 304 and no body.
          #
          # main.wasm is exempt because bench.js requests it with a hash of its
          # own contents in the query string, which makes it truly immutable.
          cache_control() {
            case "$1" in
              *.html|*.js|*.mjs|*.css) echo "public, no-cache" ;;
              *.wasm)                  echo "public, max-age=31536000, immutable" ;;
              *)                       echo "public, max-age=86400" ;;
            esac
          }

          # Upload main.wasm first, so a visitor loading the page mid-deploy
          # never gets new page code pointing at an older engine.
          ordered=$( { [ -f dist/main.wasm ] && echo dist/main.wasm
                       find dist -type f ! -name main.wasm ! -name '*.html'
                       find dist -type f -name '*.html'; } )

          count=0
          while IFS= read -r file; do
            key="${file#dist/}"
            npx --yes wrangler@4 r2 object put "$BUCKET/$key" \
              --file "$file" \
              --remote \
              --content-type "$(content_type "$file")" \
              --cache-control "$(cache_control "$file")"
            count=$((count + 1))
          done <<< "$ordered"

          echo "published $count objects to $BUCKET"

      # Uploading to the bucket is not the same as publishing. The custom
      # domain sits behind Cloudflare's cache, which will keep serving the
      # previous copy of a stable path like /js/bench.js until it is purged --
      # so a deploy that skips this step appears to succeed while visitors
      # continue to get the old site.
      - name: Purge the Cloudflare cache
        run: |
          set -euo pipefail

          if [ -z "${CF_ZONE_ID:-}" ]; then
            echo "::warning::CF_ZONE_ID is not set, so the CDN still holds the previous build. Set it to purge automatically."
            exit 0
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if echo "$response" | grep -q '"success":true'; then
            echo "cache purged for zone $CF_ZONE_ID"
          else
            echo "$response"
            echo "::warning::cache purge failed - the upload succeeded but visitors may still be served the previous build. The API token needs the Zone -> Cache Purge permission on this zone."
          fi
